# Zero-config development and testing environment:
#   cp .env.example .env && docker compose up -d
# Compose reads .env for the ${...} values below; the defaults match
# .env.example, so the stack also starts before .env exists.
name: laravel-one-shot

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: laravel-one-shot-dev
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - '${APP_PORT:-8000}:8000'
      - '${VITE_PORT:-5173}:5173'
    environment:
      VITE_HMR_HOST: '${VITE_HMR_HOST:-localhost}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/up']
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: '${DB_DATABASE:-laravel}'
      POSTGRES_USER: '${DB_USERNAME:-laravel}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
      POSTGRES_TEST_DB: '${DB_TEST_DATABASE:-testing}'
    ports:
      - '${FORWARD_DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./etc/docker/postgres/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: '${RABBITMQ_USER:-guest}'
      RABBITMQ_DEFAULT_PASS: '${RABBITMQ_PASSWORD:-guest}'
      RABBITMQ_DEFAULT_VHOST: '${RABBITMQ_VHOST:-/}'
    ports:
      - '${FORWARD_RABBITMQ_PORT:-5672}:5672'
      - '${FORWARD_RABBITMQ_DASHBOARD_PORT:-15672}:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '${FORWARD_MAILPIT_PORT:-1025}:1025'
      - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
